backend:
  name: github
  repo: IEA-Paris/seed
  branch: develop
  base_url: https://85o05b11ri.execute-api.eu-west-2.amazonaws.com/
  auth_endpoint: "/dev/auth"
  cms_label_prefix: "IEA-Paris/"
publish_mode: editorial_workflow
media_folder: "public"
public_folder: "/"
site_url: https://paris-iea.fr
logo_url: /icon.png
show_preview_links: false
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"
i18n:
  structure: multiple_folders
  locales: [en, fr]
  default_locale: en
collections:
  - name: "pages"
    label: "Editorial content" # Used in the UI
    i18n: true
    folder: "content/pages" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    # Decap folder collections are NOT recursive, and the recursive `nested`
    # mode is incompatible with `i18n: multiple_folders` (the en/fr locale dir
    # gets folded into the slug and the list comes back empty). So all docs are
    # kept flat at content/pages/<locale>/, with the route path encoded in the
    # filename using `__` as the path separator (e.g.
    # about__partners__members => route /about/partners#members). The filename
    # is shown as the entry label so editors can read the route from it.
    summary: "{{filename}}"
    fields:
      - { label: title, name: title, widget: string, i18n: true }
      - { label: Body, name: body, widget: markdown, i18n: true }
  - name: "translations"
    label: "UI translations"
    # The translation files (translations/<locale>.json) are bare flat maps
    # consumed directly by @nuxtjs/i18n, and MUST stay that way on disk. Decap
    # can only bind widgets to named fields, so two custom pieces bridge the gap
    # (both registered in public/admin/index.html):
    #   - format: json-flat  -> on read, wraps the bare map as { strings: {...} }
    #     for Decap; on write, unwraps and serialises back to the bare map, so
    #     the committed file is byte-identical in shape (verified round-trip).
    #   - widget: key-values -> renders the `strings` map as an editable
    #     key/value table (values editable, keys shown read-only).
    # `format` is set at the COLLECTION level (Decap resolves format from the
    # collection, not per-file entry).
    format: json-flat
    files:
      - name: "en"
        label: "English (en.json)"
        file: "translations/en.json"
        fields:
          - { label: "Strings", name: strings, widget: key-values }
      - name: "fr"
        label: "French (fr.json)"
        file: "translations/fr.json"
        fields:
          - { label: "Strings", name: strings, widget: key-values }
