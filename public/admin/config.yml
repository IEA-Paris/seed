backend:
  name: github
  repo: IEA-Paris/seed
  branch: develop
  base_url: https://85o05b11ri.execute-api.eu-west-2.amazonaws.com/
  auth_endpoint: "/dev/auth"
  cms_label_prefix: "IEA-Paris/"
publish_mode: editorial_workflow
media_folder: "public"
public_folder: "/"
site_url: https://paris-iea.fr
logo_url: /icon.png
show_preview_links: false
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"
i18n:
  structure: multiple_folders
  locales: [en, fr]
  default_locale: en
collections:
  - name: "pages"
    label: "Editorial content" # Used in the UI
    i18n: true
    folder: "content/pages" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    # NOTE: Decap's `nested` collection mode is incompatible with
    # `i18n: multiple_folders` (it treats the en/fr locale dir as part of the
    # slug and the entry list comes back empty). A plain folder collection
    # already recurses into the route-matching subfolders, so we instead show
    # the full route path via `summary` so editors can tell which route a file
    # belongs to.
    summary: "{{dirname}}/{{filename}}"
    fields:
      - { label: title, name: title, widget: string, i18n: true }
      - { label: Body, name: body, widget: markdown, i18n: true }
